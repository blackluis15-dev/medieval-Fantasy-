name: Build Medieval Fantasy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Medieval_Fantasy_1_1_horizontal_base.zip'
      - '.github/workflows/build-apk.yml'
      - 'menu-landscape-fix.css'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract game project
        run: |
          test -f Medieval_Fantasy_1_1_horizontal_base.zip
          unzip -q Medieval_Fantasy_1_1_horizontal_base.zip -d source
          test -f source/Medieval_Fantasy/index.html
          # Fix robust mobile start: pointerdown handles Android touch immediately;
          # click remains as keyboard/mouse fallback. Place Zerbb inside the initial camera view.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/Medieval_Fantasy/js/main.js")
          s = p.read_text()
          old_spawn = "const player={x:15*T,y:19*T,w:12,h:13,speed:88,dir:'down',moving:false};"
          new_spawn = "const player={x:20*T,y:26*T,w:12,h:13,speed:88,dir:'down',moving:false};"
          if old_spawn in s:
              s = s.replace(old_spawn, new_spawn, 1)
          old_start = """ document.getElementById('start-game').addEventListener('click',()=>{
   gameStarted=true;mainMenu.classList.add('hidden');music.start(musicPeriod());say('¡Tu aventura comienza!');
 });"""
          new_start = """ const startGame=()=>{
   if(gameStarted)return;
   gameStarted=true;
   // Centrar la cámara desde el primer fotograma para que Zerbb aparezca visible.
   cam.x=Math.max(0,Math.min(mapW*T-W,player.x-W/2));
   cam.y=Math.max(0,Math.min(mapH*T-H,player.y-H/2));
   mainMenu.classList.add('hidden');
   mainMenu.setAttribute('aria-hidden','true');
   try { music.start(musicPeriod()); }
   catch(error) { console.warn('No se pudo iniciar la música:',error); }
   say('¡Tu aventura comienza!');
 };
 const startButton=document.getElementById('start-game');
 // En Android el inicio responde al primer toque, sin depender de la síntesis de click.
 startButton.addEventListener('pointerdown',startGame,{passive:true});
 startButton.addEventListener('click',startGame);"""
          if old_start not in s:
              raise SystemExit("No se encontró el controlador original de JUGAR; se cancela el parche.")
          s = s.replace(old_start, new_start, 1)
          p.write_text(s)
          PY
          node --check source/Medieval_Fantasy/js/main.js
          cd source/Medieval_Fantasy
          mkdir www
          cp index.html manifest.webmanifest service-worker.js www/
          cp -R css js assets www/
          cp ../../menu-landscape-fix.css www/css/menu-landscape-fix.css
          sed -i 's#</head>#<link rel="stylesheet" href="css/menu-landscape-fix.css"></head>#' www/index.html
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Inspect menu layout selectors
        working-directory: source/Medieval_Fantasy
        run: |
          echo '--- MENU HTML ---'
          grep -RniE 'main-menu|menu-card|menu-buttons|game-logo|menu-emblem|JUGAR|OPCIONES|CREDITOS|CRÉDITOS|PLAY|OPTIONS' index.html css js | head -160 || true
          echo '--- MENU CSS ---'
          grep -RniE 'main-menu|menu-card|menu-buttons|game-logo|menu-emblem|menu-btn|menu-note' css | head -160 || true

      - name: Configure Capacitor Android
        working-directory: source/Medieval_Fantasy
        run: |
          npx cap init "Medieval Fantasy" com.blackluis15.medievalfantasy --web-dir www
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = 'android:screenOrientation="landscape"'
          if marker not in s:
              s = s.replace('android:exported="true"', 'android:exported="true" android:screenOrientation="landscape"', 1)
          p.write_text(s)
          PY
          npx cap sync android

      - name: Build debug APK
        working-directory: source/Medieval_Fantasy/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medieval-Fantasy-APK
          path: source/Medieval_Fantasy/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
