                savedAt:Date.now(),
                player:{x:player.x,y:player.y,dir:player.dir},
                worldClock:{minutes:worldClock.minutes,day:worldClock.day},
                cam:{x:cam.x,y:cam.y},
                weather,weatherName
              };
              localStorage.setItem('medieval-fantasy-save-v1',JSON.stringify(snapshot));
              return true;
            }catch(error){
