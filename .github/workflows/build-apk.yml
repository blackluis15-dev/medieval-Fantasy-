          start_at = s.find(start_marker)
          end_at = s.find(" });", start_at) + len(" });") if start_at >= 0 else -1
          if start_at < 0 or end_at < 0:
              raise SystemExit("No se encontró el controlador original de JUGAR; no se aplicó el parche.")
          new_lines = [
              " const startGame=()=>{",
              "   if(gameStarted)return;",
