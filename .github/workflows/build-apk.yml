          }
          function loadSavedGame(){
            try{
              const raw=localStorage.getItem('medieval-fantasy-save-v1');
              if(!raw)return false;
              const saved=JSON.parse(raw);
              if(!saved || saved.version!==1 || !saved.player ||
                 !Number.isFinite(saved.player.x) || !Number.isFinite(saved.player.y))return false;
              player.x=saved.player.x;player.y=saved.player.y;
              if(typeof saved.player.dir==='string')player.dir=saved.player.dir;
              if(saved.worldClock){
                if(Number.isFinite(saved.worldClock.minutes))worldClock.minutes=saved.worldClock.minutes;
                if(Number.isFinite(saved.worldClock.day))worldClock.day=saved.worldClock.day;
              }
              if(saved.cam && Number.isFinite(saved.cam.x) && Number.isFinite(saved.cam.y)){
                cam.x=saved.cam.x;cam.y=saved.cam.y;
              }else{
                cam.x=Math.max(0,Math.min(mapW*T-W,player.x-W/2));
                cam.y=Math.max(0,Math.min(mapH*T-H,player.y-H/2));
              }
              if(typeof saved.weather==='string')weather=saved.weather;
              if(typeof saved.weatherName==='string')weatherName=saved.weatherName;
              return true;
            }catch(error){
              console.warn('No se pudo recuperar la partida guardada:',error);
              return false;
            }
