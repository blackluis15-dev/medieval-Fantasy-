name: Build Medieval Fantasy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Medieval_Fantasy_1_1_horizontal_base.zip'
      - '.github/workflows/build-apk.yml'
      - 'menu-landscape-fix.css'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract game project
        run: |
          test -f Medieval_Fantasy_1_1_horizontal_base.zip
          unzip -q Medieval_Fantasy_1_1_horizontal_base.zip -d source
          test -f source/Medieval_Fantasy/index.html
          # Gran expansión del mapa y ambiente sonoro de lluvia.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/Medieval_Fantasy")
          main = root / "js/main.js"
          s = main.read_text()
          old = "const W=480,H=320,T=16, mapW=60,mapH=45;"
          new = "const W=480,H=320,T=16, mapW=120,mapH=90;"
          if old not in s:
              raise SystemExit("No se encontró la configuración base del mapa.")
          s = s.replace(old,new,1)
          rain_code = '''
          // Ambiente de lluvia procedural: no requiere archivos externos.
          function createRainAmbience(){
            const AudioCtx=window.AudioContext||window.webkitAudioContext;
            if(!AudioCtx)return {set(){},resume(){}};
            const ac=new AudioCtx();
            const buffer=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);
            const data=buffer.getChannelData(0);
            let seed=7411;
            for(let i=0;i<data.length;i++){seed=(seed*16807)%2147483647;data[i]=(seed/1073741823.5-1)*0.32;}
            const source=ac.createBufferSource();source.buffer=buffer;source.loop=true;
            const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1450;
            const gain=ac.createGain();gain.gain.value=0;
            source.connect(filter);filter.connect(gain);gain.connect(ac.destination);source.start();
            return {set(on){if(ac.state==='suspended')ac.resume().catch(()=>{});gain.gain.setTargetAtTime(on?0.20:0,ac.currentTime,0.8);},resume(){if(ac.state==='suspended')ac.resume().catch(()=>{});}};
          }
          '''
          anchor = " function rect(x,y,w,h,c){"
          if anchor not in s: raise SystemExit("No se encontró el punto de inserción del audio.")
          s = s.replace(anchor, rain_code + anchor, 1)
          anchor2 = " const music=createMusicPlayer({"
          if anchor2 not in s: raise SystemExit("No se encontró el reproductor de música.")
          s = s.replace(anchor2, " const rainAmbience=createRainAmbience();" + chr(10) + anchor2, 1)
          s = s.replace("   worldClock.minutes+=dt/worldClock.secondsPerGameMinute;", "   worldClock.minutes+=dt/worldClock.secondsPerGameMinute;" + chr(10) + "   rainAmbience.set(weather==='rain' && !currentBuilding);")
          s = s.replace("   gameStarted=true;mainMenu.classList.add('hidden');music.start(musicPeriod());say('¡Tu aventura comienza!');", "   gameStarted=true;mainMenu.classList.add('hidden');music.start(musicPeriod());rainAmbience.resume();rainAmbience.set(weather==='rain');say('¡Tu aventura comienza!');")
          main.write_text(s)
          world = root / "js/world/world-map.js"
          w = world.read_text()
          insert = """  // Barrios adicionales: gran pueblo extendido al este y oeste.
          buildings.push(
            {x:5,y:30,w:7,h:5,name:'Casa del molinero',roof:'#79503a',wall:'#c6ad82',style:'cottage'},
            {x:18,y:29,w:8,h:6,name:'Almacén del pueblo',roof:'#654331',wall:'#bca77e',style:'shop'},
            {x:32,y:30,w:7,h:5,name:'Casa del guardabosques',roof:'#704735',wall:'#c9b58c',style:'cottage'},
            {x:48,y:29,w:8,h:6,name:'Posada del camino',roof:'#684431',wall:'#d1bd91',style:'inn'},
            {x:65,y:31,w:7,h:5,name:'Casa de artesanos',roof:'#874536',wall:'#c9ad79',style:'cottage'},
            {x:82,y:29,w:8,h:6,name:'Almacén del este',roof:'#4d6170',wall:'#cdbb91',style:'shop'},
            {x:99,y:31,w:7,h:5,name:'Casa del puente viejo',roof:'#79503a',wall:'#c6ad82',style:'cottage'},
            {x:9,y:48,w:8,h:6,name:'Taller del herrero',roof:'#514b50',wall:'#a99b86',style:'shop'},
            {x:26,y:50,w:7,h:5,name:'Casa de la tejedora',roof:'#874536',wall:'#c9ad79',style:'cottage'},
            {x:44,y:48,w:8,h:6,name:'Granero comunal',roof:'#76513b',wall:'#c4b18a',style:'shop'},
            {x:62,y:51,w:7,h:5,name:'Casa del viajero',roof:'#4d6170',wall:'#cdbb91',style:'cottage'},
            {x:80,y:49,w:8,h:6,name:'Mercado del este',roof:'#874536',wall:'#d1bd91',style:'shop'},
            {x:101,y:50,w:7,h:5,name:'Casa del jardinero',roof:'#654331',wall:'#c6ad82',style:'cottage'},
            {x:14,y:68,w:8,h:6,name:'Posada del bosque',roof:'#684431',wall:'#d1bd91',style:'inn'},
            {x:35,y:70,w:7,h:5,name:'Casa de los leñadores',roof:'#79503a',wall:'#c6ad82',style:'cottage'},
            {x:57,y:67,w:8,h:6,name:'Almacén del sur',roof:'#4d6170',wall:'#cdbb91',style:'shop'},
            {x:78,y:70,w:7,h:5,name:'Casa del río',roof:'#874536',wall:'#c9ad79',style:'cottage'},
            {x:99,y:68,w:8,h:6,name:'Taller de carpintería',roof:'#654331',wall:'#c6ad82',style:'shop'}
          );
          """
          marker2 = "  const obstacles=buildings.map"
          if marker2 not in w: raise SystemExit("No se encontró el punto de inserción de edificios.")
          w = w.replace(marker2, insert + marker2, 1)
          world.write_text(w)
          PY
          # Integrar la textura Craftpix del puente y comprobar el paquete gráfico.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("source/Medieval_Fantasy/js/core/renderer.js")
          r=p.read_text()
          old="    warehouse:'./assets/textures/warehouse.webp'\n  };"
          new="    warehouse:'./assets/textures/warehouse.webp',\n    bridge:'./assets/textures/bridge.webp'\n  };"
          if old not in r: raise SystemExit("No se encontró el bloque de texturas del renderizador.")
          r=r.replace(old,new,1)
          old="  function drawBridge(){\n    const x=river.bridgeX-cam.x,y=river.y-cam.y,w=river.bridgeW,h=river.h;"
          new="  function drawBridge(){\n    const x=river.bridgeX-cam.x,y=river.y-cam.y,w=river.bridgeW,h=river.h;\n    if(textures.bridge&&textures.bridge.complete&&textures.bridge.naturalWidth){\n      ctx.drawImage(textures.bridge,x-10,y-12,w+20,h+24);\n      return;\n    }"
          if old not in r: raise SystemExit("No se encontró la función drawBridge.")
          r=r.replace(old,new,1)
          p.write_text(r)
          assets=Path("source/Medieval_Fantasy/assets/textures")
          required=["grass.webp","dirt.webp","tree.webp","house_wood.webp","house_stone.webp","warehouse.webp","bridge.webp"]
          missing=[name for name in required if not (assets/name).is_file() or (assets/name).stat().st_size<100]
          if missing: raise SystemExit("Faltan texturas Craftpix: "+", ".join(missing))
          print("Texturas Craftpix verificadas:",", ".join(required))
          PY
          node --check source/Medieval_Fantasy/js/core/renderer.js
          node --check source/Medieval_Fantasy/js/main.js
          node --check source/Medieval_Fantasy/js/world/world-map.js
          # Reparar inicio táctil y posición inicial del protagonista.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/Medieval_Fantasy/js/main.js")
          s = p.read_text()
          s = s.replace(
              "const player={x:15*T,y:19*T,w:12,h:13,speed:88,dir:'down',moving:false};",
              "const player={x:20*T,y:26*T,w:12,h:13,speed:88,dir:'down',moving:false};",
              1
          )
          start_marker = " document.getElementById('start-game').addEventListener('click',()=>{"
          start_at = s.find(start_marker)
          end_at = s.find(" });", start_at) + len(" });") if start_at >= 0 else -1
          if start_at < 0 or end_at < 0:
              raise SystemExit("No se encontró el controlador original de JUGAR; no se aplicó el parche.")
          new_lines = [
              " const startGame=()=>{",
              "   if(gameStarted)return;",
              "   gameStarted=true;",
              "   rainAmbience.resume();",
              "   rainAmbience.set(weather==='rain');",
              "   cam.x=Math.max(0,Math.min(mapW*T-W,player.x-W/2));",
              "   cam.y=Math.max(0,Math.min(mapH*T-H,player.y-H/2));",
              "   mainMenu.classList.add('hidden');",
              "   mainMenu.setAttribute('aria-hidden','true');",
              "   try { music.start(musicPeriod()); }",
              "   catch(error) { console.warn('No se pudo iniciar la música:',error); }",
              "   say('¡Tu aventura comienza!');",
              " };",
              " const startButton=document.getElementById('start-game');",
              " startButton.addEventListener('pointerdown',startGame,{passive:true});",
              " startButton.addEventListener('click',startGame);"
          ]
          s = s[:start_at] + chr(10).join(new_lines) + s[end_at:]
          p.write_text(s)
          PY
          # Corregir la altura del mapa que necesita el renderizador.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/Medieval_Fantasy")
          renderer = root / "js/core/renderer.js"
          rs = renderer.read_text()
          old = "createRenderer({ctx,W,H,T,mapW,cam,river,worldClock,buildings,trees,vegetation=[]})"
          new = "createRenderer({ctx,W,H,T,mapW,mapH,cam,river,worldClock,buildings,trees,vegetation=[]})"
          if old not in rs:
              raise SystemExit("No se encontró la firma esperada de createRenderer.")
          renderer.write_text(rs.replace(old, new, 1))
          main = root / "js/main.js"
          ms = main.read_text()
          old_call = "createRenderer({ctx,W,H,T,mapW,cam,river,worldClock,buildings,trees,vegetation:map.vegetation})"
          new_call = "createRenderer({ctx,W,H,T,mapW,mapH,cam,river,worldClock,buildings,trees,vegetation:map.vegetation})"
          if old_call not in ms:
              raise SystemExit("No se encontró la llamada esperada a createRenderer.")
          main.write_text(ms.replace(old_call, new_call, 1))
          loop = root / "js/core/game-loop.js"
          loop.write_text("""// Bucle principal: programa siempre el siguiente frame y registra errores.
          export function startGameLoop(update,render){
            let last=0;
            function frame(timestamp){
              requestAnimationFrame(frame);
              const dt=Math.min((timestamp-last)/1000||0,0.04);
              last=timestamp;
              try { update(dt); }
              catch(error) { console.error('Error en update() del juego:',error); }
              try { render(dt); }
              catch(error) { console.error('Error en render() del juego:',error); }
            }
            requestAnimationFrame(frame);
          }
          """)
          PY
          node --check source/Medieval_Fantasy/js/main.js
          node --check source/Medieval_Fantasy/js/core/renderer.js
          node --check source/Medieval_Fantasy/js/core/game-loop.js
          cd source/Medieval_Fantasy
          mkdir www
          cp index.html manifest.webmanifest service-worker.js www/
          cp -R css js assets www/
          cp ../../menu-landscape-fix.css www/css/menu-landscape-fix.css
          cp ../../fullscreen-play.css www/css/fullscreen-play.css
          sed -i 's#</head>#<link rel="stylesheet" href="css/menu-landscape-fix.css"><link rel="stylesheet" href="css/fullscreen-play.css"></head>#' www/index.html
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Inspect menu layout selectors
        working-directory: source/Medieval_Fantasy
        run: |
          echo '--- MENU HTML ---'
          grep -RniE 'main-menu|menu-card|menu-buttons|game-logo|menu-emblem|JUGAR|OPCIONES|CREDITOS|CRÉDITOS|PLAY|OPTIONS' index.html css js | head -160 || true
          echo '--- MENU CSS ---'
          grep -RniE 'main-menu|menu-card|menu-buttons|game-logo|menu-emblem|menu-btn|menu-note' css | head -160 || true

      - name: Configure Capacitor Android
        working-directory: source/Medieval_Fantasy
        run: |
          npx cap init "Medieval Fantasy" com.blackluis15.medievalfantasy --web-dir www
          npx cap add android
          # Publicar esta compilación como versión 1.1 de Android.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, code_count = re.subn(r'(?m)^(\s*versionCode\s+)\d+', r'\g<1>2', s, count=1)
          s, name_count = re.subn(r'(?m)^(\s*versionName\s+)[\\"\\']([^\\"\\']+)[\\"\\']', r'\g<1>"1.1"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("No se pudieron fijar versionCode 2 y versionName 1.1 en Android.")
          p.write_text(s)
          print("Versión Android configurada: versionCode=2, versionName=1.1")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = 'android:screenOrientation="landscape"'
          if marker not in s:
              s = s.replace('android:exported="true"', 'android:exported="true" android:screenOrientation="landscape"', 1)
          p.write_text(s)
          PY
          npx cap sync android

      - name: Build debug APK
        working-directory: source/Medieval_Fantasy/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medieval-Fantasy-APK
          path: source/Medieval_Fantasy/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

