          #main-menu .menu-buttons{display:flex;flex-direction:column;align-items:stretch;width:min(38vw,290px);gap:7px;margin:12px 0 0}
          #main-menu .menu-btn{padding:clamp(9px,1.7vh,15px) 18px;text-align:left;font-size:clamp(12px,1.3vw,16px);letter-spacing:2px;color:#fff1ce;background:linear-gradient(90deg,rgba(40,58,39,.94),rgba(24,35,27,.74));border:1px solid #c9ad6b;border-left:4px solid #e0c27b;border-radius:2px;box-shadow:0 3px 8px #0008;text-shadow:0 2px 3px #000}
          #main-menu .menu-btn:active{filter:brightness(1.35);transform:translateX(3px)}
          #main-menu .menu-note{font-size:10px;color:#e8dfc2;text-shadow:0 2px 4px #000;margin:12px 0 0}
          #pause-toggle{margin-left:auto;margin-right:8px;min-width:76px;padding:6px 9px;color:#fff0c7;background:rgba(39,55,39,.88);border:1px solid #c6ad70;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:1px}
          .pause-screen{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,10,8,.76);backdrop-filter:blur(4px)}
          .pause-card{width:min(88vw,430px);padding:clamp(18px,4vh,34px);text-align:center;background:linear-gradient(145deg,#354a35,#17271d);border:3px solid #c2a568;box-shadow:0 0 0 4px #1a1b14,0 18px 50px #000b;color:#f7edcf}
