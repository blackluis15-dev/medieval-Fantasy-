name: Build Medieval Fantasy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Medieval_Fantasy_1_1_horizontal_base.zip'
      - '.github/workflows/build-apk.yml'
      - 'menu-landscape-fix.css'
      - 'Medieval_Fantasy_1_5_menu.jpg'
      - 'Medieval_Fantasy_1_5_craftpix_atlas.webp'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract game project
        run: |
          test -f Medieval_Fantasy_1_1_horizontal_base.zip
          unzip -q Medieval_Fantasy_1_1_horizontal_base.zip -d source
          test -f source/Medieval_Fantasy/index.html
          # Gran expansión del mapa y ambiente sonoro de lluvia.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/Medieval_Fantasy")
          main = root / "js/main.js"
          s = main.read_text()
          old = "const W=480,H=320,T=16, mapW=60,mapH=45;"
          new = "const W=480,H=320,T=16, mapW=120,mapH=90;"
          if old not in s:
              raise SystemExit("No se encontró la configuración base del mapa.")
          s = s.replace(old,new,1)
          rain_code = '''
          // Ambiente de lluvia procedural: no requiere archivos externos.
          function createRainAmbience(){
            const AudioCtx=window.AudioContext||window.webkitAudioContext;
            if(!AudioCtx)return {set(){},resume(){}};
            const ac=new AudioCtx();
            const buffer=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);
            const data=buffer.getChannelData(0);
            let seed=7411;
            for(let i=0;i<data.length;i++){seed=(seed*16807)%2147483647;data[i]=(seed/1073741823.5-1)*0.32;}
            const source=ac.createBufferSource();source.buffer=buffer;source.loop=true;
            const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1450;
            const gain=ac.createGain();gain.gain.value=0;
            source.connect(filter);filter.connect(gain);gain.connect(ac.destination);source.start();
            return {set(on){if(ac.state==='suspended')ac.resume().catch(()=>{});gain.gain.setTargetAtTime(on?0.20:0,ac.currentTime,0.8);},resume(){if(ac.state==='suspended')ac.resume().catch(()=>{});}};
          }
          '''
          anchor = " function rect(x,y,w,h,c){"
          if anchor not in s: raise SystemExit("No se encontró el punto de inserción del audio.")
          s = s.replace(anchor, rain_code + anchor, 1)
          anchor2 = " const music=createMusicPlayer({"
          if anchor2 not in s: raise SystemExit("No se encontró el reproductor de música.")
          s = s.replace(anchor2, " const rainAmbience=createRainAmbience();" + chr(10) + anchor2, 1)
          s = s.replace("   worldClock.minutes+=dt/worldClock.secondsPerGameMinute;", "   worldClock.minutes+=dt/worldClock.secondsPerGameMinute;" + chr(10) + "   rainAmbience.set(weather==='rain' && !currentBuilding);")
          s = s.replace("   gameStarted=true;mainMenu.classList.add('hidden');music.start(musicPeriod());say('¡Tu aventura comienza!');", "   gameStarted=true;mainMenu.classList.add('hidden');music.start(musicPeriod());rainAmbience.resume();rainAmbience.set(weather==='rain');say('¡Tu aventura comienza!');")
          main.write_text(s)
          world = root / "js/world/world-map.js"
          w = world.read_text()
          insert = """  // Barrios adicionales: gran pueblo extendido al este y oeste.
          buildings.push(
            {x:5,y:30,w:7,h:5,name:'Casa del molinero',roof:'#79503a',wall:'#c6ad82',style:'cottage'},
            {x:18,y:29,w:8,h:6,name:'Almacén del pueblo',roof:'#654331',wall:'#bca77e',style:'shop'},
            {x:32,y:30,w:7,h:5,name:'Casa del guardabosques',roof:'#704735',wall:'#c9b58c',style:'cottage'},
            {x:48,y:29,w:8,h:6,name:'Posada del camino',roof:'#684431',wall:'#d1bd91',style:'inn'},
            {x:65,y:31,w:7,h:5,name:'Casa de artesanos',roof:'#874536',wall:'#c9ad79',style:'cottage'},
            {x:82,y:29,w:8,h:6,name:'Almacén del este',roof:'#4d6170',wall:'#cdbb91',style:'shop'},
            {x:99,y:31,w:7,h:5,name:'Casa del puente viejo',roof:'#79503a',wall:'#c6ad82',style:'cottage'},
            {x:9,y:48,w:8,h:6,name:'Taller del herrero',roof:'#514b50',wall:'#a99b86',style:'shop'},
            {x:26,y:50,w:7,h:5,name:'Casa de la tejedora',roof:'#874536',wall:'#c9ad79',style:'cottage'},
            {x:44,y:48,w:8,h:6,name:'Granero comunal',roof:'#76513b',wall:'#c4b18a',style:'shop'},
            {x:62,y:51,w:7,h:5,name:'Casa del viajero',roof:'#4d6170',wall:'#cdbb91',style:'cottage'},
            {x:80,y:49,w:8,h:6,name:'Mercado del este',roof:'#874536',wall:'#d1bd91',style:'shop'},
            {x:101,y:50,w:7,h:5,name:'Casa del jardinero',roof:'#654331',wall:'#c6ad82',style:'cottage'},
            {x:14,y:68,w:8,h:6,name:'Posada del bosque',roof:'#684431',wall:'#d1bd91',style:'inn'},
            {x:35,y:70,w:7,h:5,name:'Casa de los leñadores',roof:'#79503a',wall:'#c6ad82',style:'cottage'},
            {x:57,y:67,w:8,h:6,name:'Almacén del sur',roof:'#4d6170',wall:'#cdbb91',style:'shop'},
            {x:78,y:70,w:7,h:5,name:'Casa del río',roof:'#874536',wall:'#c9ad79',style:'cottage'},
            {x:99,y:68,w:8,h:6,name:'Taller de carpintería',roof:'#654331',wall:'#c6ad82',style:'shop'}
          );
          """
          marker2 = "  const obstacles=buildings.map"
          if marker2 not in w: raise SystemExit("No se encontró el punto de inserción de edificios.")
          w = w.replace(marker2, insert + marker2, 1)
          world.write_text(w)
          PY
          # Intro de Emine Entertainment: pantalla de marca con entrada y salida suaves.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/Medieval_Fantasy")
          intro_html = r"""
          <div id="emine-splash" aria-label="Emine Entertainment">
            <svg class="emine-mark" viewBox="0 0 760 360" role="img" aria-label="Emine Entertainment">
              <g fill="#050505">
                <path d="M330 20h100l-100 55V50l65-30z"/>
                <path d="M330 78l100-55v30l-100 55z"/>
                <path d="M330 136l100-55v30l-100 55z"/>
                <path d="M330 194l100-55v30l-100 55z"/>
              </g>
              <text x="380" y="270" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="400" fill="#050505" letter-spacing="-4">Emine</text>
              <text x="380" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="300" fill="#777" letter-spacing="13">entertainment</text>
            </svg>
          </div>
          """
          css = r"""
          #emine-splash{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#fff;opacity:0;visibility:visible;pointer-events:all;transition:opacity 1s ease}
          #emine-splash.emine-show{opacity:1}
          #emine-splash.emine-hide{opacity:0;pointer-events:none}
          #emine-splash .emine-mark{width:min(78vw,760px);max-height:68vh;height:auto}
          @media(prefers-reduced-motion:reduce){#emine-splash{transition:none}}
          """
          js = r"""
          (() => {
            const start = () => {
              const splash = document.getElementById('emine-splash');
              if (!splash) return;
              requestAnimationFrame(() => splash.classList.add('emine-show'));
              window.setTimeout(() => {
                splash.classList.remove('emine-show');
                splash.classList.add('emine-hide');
                window.setTimeout(() => splash.remove(), 1100);
              }, 2600);
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});
            else start();
          })();
          """
          p = root / "index.html"
          html = p.read_text()
          if 'id="emine-splash"' not in html:
              html = html.replace("</body>", intro_html + '<link rel="stylesheet" href="css/emine-intro.css"><script src="js/emine-intro.js" defer></script></body>', 1)
          p.write_text(html)
          (root / "css" / "emine-intro.css").write_text(css)
          (root / "js" / "emine-intro.js").write_text(js)
          print("Intro Emine Entertainment instalada.")
          PY
          # Menú cinematográfico y sistema real de pausa.
          python3 - <<'PY'
          from pathlib import Path
          root=Path("source/Medieval_Fantasy")
          main=root/"js/main.js"
          s=main.read_text()
          if "let gamePaused=false;" not in s:
              s=s.replace(" let gameStarted=false;"," let gameStarted=false;\n let gamePaused=false;",1)
          old="   if(!gameStarted || inventory.isOpen()){keys.up=keys.down=keys.left=keys.right=false;return;}"
          new="   if(!gameStarted || gamePaused || inventory.isOpen()){keys.up=keys.down=keys.left=keys.right=false;return;}"
          if old not in s: raise SystemExit("No se encontró la guarda de update() para activar pausa.")
          s=s.replace(old,new,1)
          render_old="else{renderer.drawWorld();drawAtmosphere(dt);drawPlayer();}"
          render_new="else{renderer.drawWorld();drawAtmosphere(gamePaused?0:dt);drawPlayer();}"
          if render_old in s: s=s.replace(render_old,render_new,1)
          start_old="   if(gameStarted)return;\n   gameStarted=true;"
          start_new="""   if(gameStarted)return;
           try {
             const raw=localStorage.getItem('medieval-fantasy-save-v1');
             if(raw){
               const saved=JSON.parse(raw);
               if(saved.player)Object.assign(player,saved.player);
               if(saved.worldClock)Object.assign(worldClock,saved.worldClock);
               if(saved.weather)weather=saved.weather;
               if(saved.weatherName)weatherName=saved.weatherName;
             }
           } catch(error) { console.warn('No se pudo cargar la partida guardada:',error); }
           gameStarted=true;"""
          if start_old in s: s=s.replace(start_old,start_new,1)
          anchor=" const inventoryScreen=document.getElementById('inventory-screen');"
          pause_js="""
          const pauseButton=document.createElement('button');
          pauseButton.id='pause-toggle';pauseButton.type='button';pauseButton.textContent='Ⅱ PAUSA';
          pauseButton.setAttribute('aria-label','Pausar partida');
          document.querySelector('header').appendChild(pauseButton);
          const pausePanel=document.createElement('section');
          pausePanel.id='pause-screen';pausePanel.className='pause-screen hidden';
          pausePanel.innerHTML='<div class="pause-card"><div class="pause-kicker">MEDIEVAL FANTASY</div><h2>PARTIDA EN PAUSA</h2><p>El mundo espera tu regreso, aventurero.</p><div class="pause-actions"><button id="pause-resume">▶ CONTINUAR</button><button id="pause-save">✦ GUARDAR PARTIDA</button><button id="pause-options">⚙ OPCIONES</button><button id="pause-menu">⌂ VOLVER AL MENÚ</button></div><small id="pause-feedback">Tu aventura está detenida.</small></div>';
          document.getElementById('stage').appendChild(pausePanel);
          const clearMovement=()=>{keys.up=keys.down=keys.left=keys.right=false;player.moving=false;};
          function setPaused(value){
            if(!gameStarted && value)return;
            gamePaused=!!value;clearMovement();
            pausePanel.classList.toggle('hidden',!gamePaused);
            pauseButton.textContent=gamePaused?'▶ SEGUIR':'Ⅱ PAUSA';
            pauseButton.setAttribute('aria-label',gamePaused?'Reanudar partida':'Pausar partida');
            rainAmbience.set(!gamePaused && weather==='rain' && !currentBuilding);
          }
          pauseButton.addEventListener('click',()=>setPaused(!gamePaused));
          pausePanel.querySelector('#pause-resume').addEventListener('click',()=>setPaused(false));
          pausePanel.querySelector('#pause-save').addEventListener('click',()=>{
            try{
              localStorage.setItem('medieval-fantasy-save-v1',JSON.stringify({
                player:{x:player.x,y:player.y,dir:player.dir},worldClock:{minutes:worldClock.minutes,day:worldClock.day},
                cam:{x:cam.x,y:cam.y},weather,weatherName
              }));
              pausePanel.querySelector('#pause-feedback').textContent='Partida guardada correctamente.';
            }catch(error){pausePanel.querySelector('#pause-feedback').textContent='No se pudo guardar en este dispositivo.';}
          });
          pausePanel.querySelector('#pause-options').addEventListener('click',()=>{
            pausePanel.querySelector('#pause-feedback').textContent='Controles: usa WASD, flechas o los controles táctiles.';
          });
          pausePanel.querySelector('#pause-menu').addEventListener('click',()=>{
            setPaused(false);gameStarted=false;clearMovement();
            mainMenu.classList.remove('hidden');mainMenu.setAttribute('aria-hidden','false');
            pausePanel.classList.add('hidden');
          });
          document.addEventListener('keydown',event=>{
            if(event.code==='Escape' && gameStarted && !inventory.isOpen()){
              event.preventDefault();setPaused(!gamePaused);
            }
          });
          """
          if anchor not in s: raise SystemExit("No se encontró el punto de montaje del panel de pausa.")
          if "id='pause-screen'" not in s:
              s=s.replace(anchor,anchor+"\n"+pause_js,1)
          main.write_text(s)
          # Estilo de menú principal a pantalla completa y pausa.
          css=r"""
          /* Medieval Fantasy 1.3 — menú ilustrado y pausa */
          #main-menu{padding:0;background:linear-gradient(90deg,rgba(7,16,12,.82) 0%,rgba(7,16,12,.56) 42%,rgba(7,16,12,.08) 100%),linear-gradient(0deg,rgba(5,12,8,.28),transparent 48%);justify-content:flex-start;align-items:center}
          #main-menu .menu-card{width:100%;height:100%;max-height:none;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:5vh 7vw;background:transparent;border:0;box-shadow:none;text-align:left}
          #main-menu .menu-card:before,#main-menu .sparkle{display:none}
          #main-menu .menu-emblem{width:clamp(100px,17vw,190px);max-height:clamp(58px,15vh,110px);object-position:left;margin:0 0 10px;filter:drop-shadow(0 4px 7px #000)}
          #main-menu .game-logo{font-size:clamp(27px,5vw,58px);line-height:1.02;max-width:48vw;color:#fff0c3;text-shadow:3px 4px 0 #251b13,0 0 16px #d2a85a;margin:0 0 7px;letter-spacing:1px}
          #main-menu .menu-subtitle{font-size:clamp(9px,1.25vw,14px);letter-spacing:clamp(2px,.5vw,5px);color:#e6d8b1;text-shadow:0 2px 4px #000;margin:0 0 12px}
