          images=[p for p in found if p.is_file() and p.suffix.lower() in (".png",".jpg",".jpeg",".webp")]
          print("Recursos gráficos encontrados:",len(images))
          for p in images[:60]: print(p)
          PY
          node --check source/Medieval_Fantasy/js/core/renderer.js
