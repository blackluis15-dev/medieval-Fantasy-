          (world/'tree-textures.svg').write_text(tree_svg)
          # 2) Mejorar la textura existente de Zerbb sin cambiar la cuadrícula 4x4.
          char_dir=assets/'characters'
          original=Image.open(char_dir/'zerbb-walk.png').convert('RGBA')
          rgb=Image.new('RGB',original.size,(0,0,0))
          rgb.paste(original.convert('RGB'),mask=original.getchannel('A'))
          rgb=ImageEnhance.Brightness(rgb).enhance(1.12)
          rgb=ImageEnhance.Contrast(rgb).enhance(1.18)
          rgb=ImageEnhance.Color(rgb).enhance(1.24)
          rgb=ImageEnhance.Sharpness(rgb).enhance(1.7)
          rgb=rgb.filter(ImageFilter.UnsharpMask(radius=1,percent=115,threshold=2))
          improved=rgb.convert('RGBA')
          improved.putalpha(original.getchannel('A'))
          improved.save(char_dir/'zerbb-walk-1.5.1.png',optimize=True)
          cp=Path('js/characters-player.js')
          cs=cp.read_text().replace("./assets/images/characters/zerbb-walk.png","./assets/images/characters/zerbb-walk-1.5.1.png",1)
          cp.write_text(cs)
          # 3) Usar el emblema M/castillo del juego como logo de menú y generar iconos Android.
          logo=Image.open(assets/'logo/medieval-fantasy-logo.png').convert('RGBA')
          alpha=logo.getchannel('A')
          # Recortar el espacio transparente sobrante que desplaza el emblema hacia un lado.
          xs=[x for x in range(logo.width) if sum(1 for yy in range(logo.height) if alpha.getpixel((x,yy))>100)>5]
          ys=[yy for yy in range(logo.height) if sum(1 for x in range(logo.width) if alpha.getpixel((x,yy))>100)>5]
          if xs and ys: logo=logo.crop((min(xs),min(ys),max(xs)+1,max(ys)+1))
          logo.save(assets/'logo/medieval-fantasy-logo.png',optimize=True)
          def make_icon(size):
              canvas=Image.new('RGBA',(size,size),(9,22,48,255))
              d=ImageDraw.Draw(canvas)
              pad=max(4,size//32)
              d.rounded_rectangle((pad,pad,size-pad,size-pad),radius=size//8,outline=(214,174,82,255),width=max(2,size//48))
              maxbox=int(size*.78)
              logo2=logo.copy()
              logo2.thumbnail((maxbox,maxbox),Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo2,((size-logo2.width)//2,(size-logo2.height)//2))
              return canvas.convert('RGB')
          icons=assets/'icons';icons.mkdir(parents=True,exist_ok=True)
          make_icon(192).save(icons/'medieval-fantasy-192.png',quality=95)
          make_icon(512).save(icons/'medieval-fantasy-512.png',quality=95)
          # 4) Cambiar variantes de árboles, sin tocar edificios ni suelo.
          mp=Path('js/world/world-map.js')
          ms=mp.read_text().replace("variant:(x*3+y*5)%3","variant:(x*3+y*5)%6",1)
          mp.write_text(ms)
          # 5) Reemplazar únicamente el dibujo de árboles por el nuevo atlas.
          rp=Path('js/core/renderer.js')
          rs=rp.read_text()
          if "const treeSheet=new Image()" not in rs:
              rs=rs.replace("  const hash=(x,y,n=0)=>Math.abs((x*374761393+y*668265263+n*1442695041)>>>0);",
                "  const hash=(x,y,n=0)=>Math.abs((x*374761393+y*668265503+n*1442695041)>>>0);\n  const treeSheet=new Image();let treeSheetLoaded=false;treeSheet.src='./assets/images/world/tree-textures.svg';treeSheet.onload=()=>{treeSheetLoaded=true;};",1)
          new_tree="""  function drawTree(t){
            const x=t.x-cam.x,y=t.y-cam.y,variant=(t.variant||0)%6;
            if(!treeSheetLoaded){
              rect(x-8,y+7,20,5,'#315b37');rect(x-2,y-3,8,15,'#725039');
              rect(x-10,y-13,24,17,['#245536','#315b35','#1f4b3b'][variant%3]);
              return;
            }
            const sx=(variant%3)*128,sy=Math.floor(variant/3)*128;
            const dw=44,dh=58,dx=Math.round(x-dw/2),dy=Math.round(y-dh+12);
            ctx.fillStyle='rgba(18,35,22,.32)';
            ctx.beginPath();ctx.ellipse(x,y+10,13,4,0,0,Math.PI*2);ctx.fill();
            ctx.imageSmoothingEnabled=false;
            ctx.drawImage(treeSheet,sx,sy,128,128,dx,dy,dw,dh);
          }
          """
          pattern=r"  function drawTree\(t\)\{.*?\n  \}\n  function drawVegetation"
          rs2=re.sub(pattern,new_tree+"  function drawVegetation",rs,count=1,flags=re.S)
          if rs2==rs: raise SystemExit('No se pudo localizar drawTree() para aplicar las texturas.')
          rp.write_text(rs2)
          # 6) Hoja de estilo: fondo original suavemente desenfocado, contenido nítido.
          css=Path('www/css/menu-v151-visuals.css')
          css.write_text(r'''/* Medieval Fantasy 1.5.1 */
          #main-menu{isolation:isolate!important;background:transparent!important;overflow:hidden!important}
          #main-menu::before{content:"";position:absolute;inset:-12px;z-index:-1;pointer-events:none;background-image:linear-gradient(90deg,rgba(4,9,22,.62),rgba(4,9,22,.20) 55%,rgba(4,9,22,.08)),url("../assets/images/menu/medieval-fantasy-menu.svg");background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(5px) brightness(.82) saturate(1.08);transform:scale(1.035)}
          #main-menu .menu-card{position:relative!important;z-index:1!important}
          #main-menu .menu-emblem{width:clamp(105px,15vw,180px)!important;max-height:clamp(65px,16vh,125px)!important;object-fit:contain!important;image-rendering:pixelated!important;filter:drop-shadow(0 4px 7px #000)!important}
          ''')
          html=Path('www/index.html')
          h=html.read_text()
          if 'menu-v151-visuals.css' not in h:
              h=h.replace('</head>','<link rel="stylesheet" href="css/menu-v151-visuals.css"></head>',1)
          html.write_text(h)
          # Publicar archivos modificados al directorio web que Capacitor empaqueta.
          import shutil
          for rel in ['assets/images/world/tree-textures.svg','assets/images/characters/zerbb-walk-1.5.1.png','assets/images/icons/medieval-fantasy-192.png','assets/images/icons/medieval-fantasy-512.png','assets/images/logo/medieval-fantasy-logo.png']:
              src=Path(rel);dst=Path('www')/rel;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)
          shutil.copy2('js/characters-player.js','www/js/characters-player.js')
          shutil.copy2('js/core/renderer.js','www/js/core/renderer.js')
          shutil.copy2('js/world/world-map.js','www/js/world/world-map.js')
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          manifest['description']='Medieval Fantasy 1.5.1: aventura medieval en un mundo pixel art.'
          Path('manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          shutil.copy2('manifest.webmanifest','www/manifest.webmanifest')
          print('Medieval Fantasy 1.5.1: fondo difuminado, emblema, iconos, árboles y Zerbb actualizados.')
          PY
          node --check js/characters-player.js
          node --check js/core/renderer.js
          node --check js/world/world-map.js
          echo 'Recursos 1.5.1 listos para empaquetar.'
      - name: Configure Capacitor Android
        working-directory: source/Medieval_Fantasy
        run: |
          npx cap init "Medieval Fantasy" com.blackluis15.medievalfantasy --web-dir www
          npx cap add android
          # Publicar esta compilación como versión 1.5 de Android.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          lines = p.read_text().splitlines()
          code_found = False
          name_found = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode "):
                  lines[i] = indent + "versionCode 7"
                  code_found = True
              elif stripped.startswith("versionName "):
                  lines[i] = indent + 'versionName "1.5.1"'
                  name_found = True
          if not code_found or not name_found:
              raise SystemExit("No se encontraron versionCode y versionName en build.gradle")
          p.write_text(chr(10).join(lines) + chr(10))
          print("Versión Android configurada: versionCode=7, versionName=1.5.1")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = 'android:screenOrientation="landscape"'
          if marker not in s:
              s = s.replace('android:exported="true"', 'android:exported="true" android:screenOrientation="landscape"', 1)
          p.write_text(s)
          PY
          npx cap sync android
          # Icono Android: reutilizar el emblema oficial M/castillo en todos los tamaños.
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET
          res=Path('android/app/src/main/res')
          logo=Image.open('www/assets/images/icons/medieval-fantasy-512.png').convert('RGBA')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              d=res/folder;d.mkdir(parents=True,exist_ok=True)
              icon=logo.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
          draw=res/'drawable';draw.mkdir(parents=True,exist_ok=True)
          fg=logo.resize((432,432),Image.Resampling.LANCZOS)
          fg.save(draw/'ic_launcher_foreground.png',optimize=True)
          vals=res/'values';vals.mkdir(parents=True,exist_ok=True)
          (vals/'ic_launcher_background.xml').write_text('<resources><color name="ic_launcher_background">#091630</color></resources>')
          adaptive=res/'mipmap-anydpi-v26';adaptive.mkdir(parents=True,exist_ok=True)
          xml='<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>'
          (adaptive/'ic_launcher.xml').write_text(xml)
          (adaptive/'ic_launcher_round.xml').write_text(xml)
          print('Icono de aplicación Android actualizado con el emblema oficial.')
          PY

      - name: Build debug APK
        working-directory: source/Medieval_Fantasy/android
        run: |
          for attempt in 1 2 3; do
            echo "Intento de compilación Android $attempt de 3"
            if ./gradlew --no-daemon --stacktrace assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "La compilación falló; esperando para reintentar la descarga de dependencias..."
              sleep 25
            fi
          done
          echo "La compilación falló después de 3 intentos."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medieval-Fantasy-APK
          path: source/Medieval_Fantasy/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

