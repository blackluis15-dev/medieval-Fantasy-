          if old_call not in ms:
              raise SystemExit("No se encontró la llamada esperada a createRenderer.")
          main.write_text(ms.replace(old_call, new_call, 1))
          loop = root / "js/core/game-loop.js"
          loop.write_text("""// Bucle principal: programa siempre el siguiente frame y registra errores.
