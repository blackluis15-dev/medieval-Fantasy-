            let last=0;
            function frame(timestamp){
              requestAnimationFrame(frame);
              const dt=Math.min((timestamp-last)/1000||0,0.04);
              last=timestamp;
              try { update(dt); }
              catch(error) { console.error('Error en update() del juego:',error); }
              try { render(dt); }
              catch(error) { console.error('Error en render() del juego:',error); }
            }
            requestAnimationFrame(frame);
          }
          """)
